---
# ==============================================================================
# ShopLite: Master Kubernetes & Node Bootstrapping Playbook (Question 4.g)
# Applies:
# 1. Base OS dependencies & Kernel modules (common)
# 2. Modern Container Runtime (containerd)
# 3. Kubernetes Node Binaries (kubeadm, kubelet, kubectl)
# 4. Host Security Hardening & Backup Automations (hardening)
# ==============================================================================

- name: "Bootstrap & Configure All Kubernetes Cluster Nodes"
  hosts: k8s_cluster
  become: true
  gather_facts: true

  roles:
    - role: common
      tags: ["common", "bootstrap"]

    - role: containerd
      tags: ["containerd", "runtime"]

    - role: kubernetes
      tags: ["kubernetes", "k8s"]

    - role: hardening
      tags: ["hardening", "security"]

