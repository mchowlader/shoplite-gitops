---
# ==============================================================================
# ShopLite: Complete End-to-End Infrastructure Automation Entrypoint
# Runs:
# 1. playbook.yml     -> Bootstraps OS, containerd, k8s binaries, and Linux hardening
# 2. cluster-init.yml -> Initializes Control-Plane, CNI networking, and joins Workers
# ==============================================================================

- name: Phase 1 — Server Bootstrapping & Security Hardening
  ansible.builtin.import_playbook: playbook.yml

- name: Phase 2 — Kubernetes Cluster Initialization & Node Assembly
  ansible.builtin.import_playbook: cluster-init.yml

