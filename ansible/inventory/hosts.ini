# ==============================================================================
# ShopLite Kubernetes Cluster Inventory (Question 4.g)
# Control-Plane and Worker EC2 Nodes in AWS Private Subnets
# ==============================================================================

[control_plane]
cp-node-1 ansible_host=10.0.10.187 node_role=control_plane

[workers]
worker-node-1 ansible_host=10.0.10.106 node_role=worker
worker-node-2 ansible_host=10.0.20.42  node_role=worker

[k8s_cluster:children]
control_plane
workers

[k8s_cluster:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
kubernetes_version='1.30'
pod_network_cidr='10.244.0.0/16'
service_cidr='10.96.0.0/12'

