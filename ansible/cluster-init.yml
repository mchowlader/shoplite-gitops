---
# ==============================================================================
# ShopLite: Kubernetes Cluster Initialization & Join Playbook (Question 4.g / 5)
# 1. Runs 'kubeadm init' on Control-Plane node
# 2. Configures kubeconfig for administrative access
# 3. Deploys Flannel CNI pod networking
# 4. Generates join token and joins Worker nodes to cluster
# 5. Asserts all nodes achieve 'Ready' status
# ==============================================================================

- name: Initialize Kubernetes Control-Plane
  hosts: control_plane
  become: true
  tasks:
    - name: Check if Kubernetes control-plane is already initialized
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: k8s_admin_conf

    - name: Initialize Kubernetes cluster with kubeadm
      ansible.builtin.command: >
        kubeadm init
        --apiserver-advertise-address={{ ansible_host }}
        --pod-network-cidr={{ pod_network_cidr }}
        --service-cidr={{ service_cidr }}
        --kubernetes-version=v{{ kubernetes_version }}.0
      when: not k8s_admin_conf.stat.exists
      register: kubeadm_init_output

    - name: Ensure .kube directory exists for ubuntu user
      ansible.builtin.file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0750'

    - name: Copy admin.conf to ubuntu user kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        remote_src: true
        owner: ubuntu
        group: ubuntu
        mode: '0600'

    - name: Ensure root also has access to kubeconfig
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        mode: '0750'

    - name: Copy admin.conf to root kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: true
        mode: '0600'

    - name: Deploy Flannel CNI overlay network
      ansible.builtin.command: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: cni_deploy
      changed_when: "'created' in cni_deploy.stdout or 'configured' in cni_deploy.stdout"

    - name: Deploy NGINX Ingress Controller
      ansible.builtin.command: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/baremetal/deploy.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: ingress_deploy
      changed_when: "'created' in ingress_deploy.stdout or 'configured' in ingress_deploy.stdout"

    - name: Patch Ingress Controller deployment for hostNetwork binding
      ansible.builtin.command: >
        kubectl patch deployment ingress-nginx-controller -n ingress-nginx
        --type='json' -p='[{"op": "add", "path": "/spec/template/spec/hostNetwork", "value": true}]'
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: ingress_patch
      changed_when: "'patched' in ingress_patch.stdout"

    - name: Deploy Argo Rollouts Progressive Delivery Controller
      ansible.builtin.command: kubectl apply -n argo-rollouts -f https://github.com/argoproj/argo-rollouts/releases/latest/download/install.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: argo_deploy
      changed_when: "'created' in argo_deploy.stdout or 'configured' in argo_deploy.stdout"

    - name: Generate fresh kubeadm join command for worker nodes
      ansible.builtin.command: kubeadm token create --print-join-command
      register: kubeadm_join_command
      changed_when: false

    - name: Store join command as in-memory fact for workers
      ansible.builtin.set_fact:
        worker_join_cmd: "{{ kubeadm_join_command.stdout }}"

- name: Join Worker Nodes to Kubernetes Cluster
  hosts: workers
  become: true
  tasks:
    - name: Check if worker node is already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: k8s_kubelet_conf

    - name: Execute kubeadm join command on worker nodes
      ansible.builtin.command: "{{ hostvars[groups['control_plane'][0]]['worker_join_cmd'] }}"
      when: not k8s_kubelet_conf.stat.exists
      register: worker_join_output

- name: Verify Cluster Health & Node States
  hosts: control_plane
  become: false
  tasks:
    - name: Wait for all nodes to achieve Ready status
      ansible.builtin.command: kubectl get nodes --no-headers
      register: node_status
      until: >
        node_status.stdout_lines | length == 3 and
        not ('NotReady' in node_status.stdout)
      retries: 24
      delay: 10
      changed_when: false

    - name: Display cluster node summary
      ansible.builtin.command: kubectl get nodes -o wide
      register: cluster_nodes
      changed_when: false

    - name: Print live Kubernetes cluster status
      ansible.builtin.debug:
        var: cluster_nodes.stdout_lines

