---
# ==============================================================================
# Role: containerd — Production Container Runtime for Kubernetes CRI
# Configures containerd with SystemdCgroup driver for kubelet alignment
# ==============================================================================

- name: Create directory for Docker / containerd APT keyrings
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add Docker / containerd official GPG signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: false

- name: Add Docker / containerd official APT repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Install containerd.io package
  ansible.builtin.apt:
    name: containerd.io
    state: present
    update_cache: true

- name: Ensure containerd configuration directory exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: '0755'

- name: Generate default containerd configuration
  ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml

- name: Enable SystemdCgroup driver in containerd config (Mandatory for Kubernetes)
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: '(\s+SystemdCgroup\s+=\s+)false'
    replace: '\1true'

- name: Restart and enable containerd service
  ansible.builtin.systemd:
    name: containerd
    state: restarted
    enabled: true
    daemon_reload: true

