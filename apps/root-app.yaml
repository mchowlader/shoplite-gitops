# ==============================================================================
# ShopLite: ArgoCD Root App-of-Apps (GitOps Single Entrypoint)
# Declaratively reconciles all applications under apps/argocd-applications/
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shoplite-platform-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mchowlader/shoplite-gitops.git
    targetRevision: main
    path: apps/argocd-applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
