# ==============================================================================
# ShopLite Observability: kube-prometheus-stack (Prometheus, Alertmanager, Grafana)
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "94.1.0"
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $monitoring/monitoring/prometheus/kube-prometheus-stack-values.yaml
    - repoURL: https://github.com/mchowlader/shoplite-app.git
      targetRevision: main
      ref: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
