# ==============================================================================
# ShopLite: ArgoCD GitOps Application Manifest (Question 7.b)
# Continuous Delivery Engine managing declarative Kubernetes deployment
# Features:
#   - Automated Git polling & synchronization
#   - Self-Healing (reverts out-of-band cluster modifications back to Git)
#   - Automated Pruning (removes orphaned resources deleted from Git)
# ==============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shoplite-app
  namespace: argocd
  finalizers:
    # Ensures cascading deletion of Kubernetes resources when Application is deleted
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: shoplite
    app.kubernetes.io/part-of: shoplite-suite
    environment: dev

spec:
  # Project group inside ArgoCD (default project allows unrestricted destination namespaces)
  project: default

  # Source of Truth: The GitOps Git Repository
  source:
    repoURL: https://github.com/mchowlader/shoplite-gitops.git
    targetRevision: main
    path: helm/shoplite
    helm:
      valueFiles:
        - values.yaml

  # Destination: The Target Kubernetes Cluster & Namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: shoplite

  # Automated GitOps Synchronization & Self-Healing Policies
  syncPolicy:
    automated:
      prune: true     # Automatically delete cluster resources deleted from Git
      selfHeal: true  # Automatically revert manual kubectl changes back to Git state
    syncOptions:
      - CreateNamespace=true      # Auto-create 'shoplite' namespace if missing
      - ApplyOutOfSyncOnly=true   # Optimize cluster API calls by applying only drifted resources
      - PruneLast=true            # Delete obsolete resources only after new ones are healthy
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
