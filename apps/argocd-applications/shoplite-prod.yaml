# ==============================================================================
# ShopLite: ArgoCD Production Application (Question 7.1c)
# Multi-source: chart from shoplite-app + overrides from shoplite-gitops
# Sync Policy: Manual sync required for production, self-healing enabled
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shoplite-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: shoplite
    environment: prod
spec:
  project: default
  sources:
    - repoURL: https://github.com/mchowlader/shoplite-app.git
      targetRevision: main
      path: helm/shoplite
      helm:
        releaseName: shoplite
        valueFiles:
          - $values/envs/prod/values.yaml
    - repoURL: https://github.com/mchowlader/shoplite-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: shoplite
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
