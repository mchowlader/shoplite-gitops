adminPassword: "admin"

persistence:
  enabled: false

grafana.ini:
  server:
    root_url: "%(protocol)s://%(domain)s/grafana/"
    serve_from_sub_path: true

extraConfigMapMounts:
  - name: datasources
    mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
    subPath: datasources.yaml
    configMap: grafana-datasources
    readOnly: true
  - name: dashboard-provider
    mountPath: /etc/grafana/provisioning/dashboards/dashboard-provider.yaml
    subPath: dashboard-provider.yaml
    configMap: grafana-dashboard-provider
    readOnly: true
  - name: shoplite-dashboard
    mountPath: /var/lib/grafana/dashboards/shoplite-overview.json
    subPath: shoplite-overview.json
    configMap: grafana-shoplite-dashboard
    readOnly: true
