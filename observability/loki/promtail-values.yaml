# ==============================================================================
# ShopLite: Grafana Promtail Configuration (Question 6.3)
# DaemonSet log shipper collecting container logs from /var/log/pods
# Parses structured JSON logs, extracts 'trace_id', 'level', & ships to Loki
# ==============================================================================

config:
  clients:
    - url: http://shoplite-loki.observability.svc.cluster.local:3100/loki/api/v1/push

  snippets:
    pipelineStages:
      # Stage 1: Parse CRI / Containerd log format
      - cri: {}

      # Stage 2: Parse ShopLite Structured JSON logs (Section 1.4c)
      - json:
          expressions:
            level: level
            service: service
            trace_id: trace_id
            message: message

      # Stage 3: Promote JSON fields to searchable Loki labels
      - labels:
          level:
          service:

      # Stage 4: Clean up output message
      - output:
          source: message
