# ==============================================================================
# ShopLite: Grafana Loki Configuration (Question 6.3)
# Centralized, cost-efficient log aggregation engine (Labels-only index)
# Retention: 7 days (168 hours) matching Prometheus metrics retention
# ==============================================================================

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  storage:
    type: filesystem

  limits_config:
    retention_period: 168h
    max_query_length: 721h
    max_query_series: 5000

  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
    accessModes:
      - ReadWriteOnce
