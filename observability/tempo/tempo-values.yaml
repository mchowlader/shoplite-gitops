# ==============================================================================
# ShopLite: Grafana Tempo Configuration (Question 6.4)
# Distributed Tracing Backend for OpenTelemetry (OTLP) Traces
# Visualizes end-to-end request journeys (Frontend -> Backend -> DB / Redis)
# ==============================================================================

tempo:
  # 1. Receiver Endpoints: Where applications send their trace spans
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317
    jaeger:
      protocols:
        thrift_http:
          endpoint: 0.0.0.0:14268
    zipkin:
      endpoint: 0.0.0.0:9411

  # 2. Trace Storage: Local filesystem retention (Zero AWS EBS extra cost)
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal

  # 3. Retention: Keep traces for 24 hours
  retention: 24h

# 4. Resource Boundaries: Lightweight footprint
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

# 5. Persistence: Disabled (Uses node emptyDir storage to maintain 30GB Free Tier)
persistence:
  enabled: false
