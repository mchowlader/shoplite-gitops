apiVersion: v1
kind: Service
metadata:
  name: {{ include "shoplite.fullname" . }}-grafana
  labels:
    {{- include "shoplite.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana-bridge
spec:
  type: ExternalName
  externalName: shoplite-grafana.observability.svc.cluster.local
  ports:
    - port: 80
      targetPort: 80
      name: http
