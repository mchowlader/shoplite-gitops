{{- if and (not .Values.postgres.auth.existingSecret) .Values.postgres.auth.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shoplite.fullname" . }}-db-secret
  labels:
    {{- include "shoplite.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ .Values.postgres.auth.password | b64enc | quote }}
{{- end }}

