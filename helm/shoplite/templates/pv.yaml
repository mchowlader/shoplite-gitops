{{- if and .Values.postgres.enabled .Values.postgres.persistence.enabled }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "shoplite.fullname" . }}-postgres-pv
  labels:
    {{- include "shoplite.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  capacity:
    storage: {{ .Values.postgres.persistence.size | quote }}
  accessModes:
    - {{ .Values.postgres.persistence.accessMode | quote }}
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ .Values.postgres.persistence.storageClass | default "local-storage" | quote }}
  hostPath:
    path: /var/data/shoplite/postgres
    type: DirectoryOrCreate
{{- end }}
