{{- if and .Values.backend.enabled .Values.argoRollouts .Values.argoRollouts.enabled .Values.argoRollouts.analysis .Values.argoRollouts.analysis.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "shoplite.fullname" . }}-backend-analysis
  labels:
    {{- include "shoplite.labels" . | nindent 4 }}
spec:
  args:
    - name: service-name
  metrics:
    # --------------------------------------------------------------------------
    # Metric 1: Success Rate (HTTP 5xx rate must be < 1% i.e. success rate >= 99%)
    # --------------------------------------------------------------------------
    - name: success-rate
      interval: 30s
      count: 3
      failureLimit: {{ .Values.argoRollouts.analysis.failureLimit | default 1 }}
      successCondition: len(result) == 0 || result[0] >= 0.99
      provider:
        prometheus:
          address: {{ .Values.argoRollouts.analysis.prometheusAddress | quote }}
          query: >-
            sum(rate(http_requests_total{status!~"5..", app="shoplite"}[1m]))
            /
            (sum(rate(http_requests_total{app="shoplite"}[1m])) > 0)

    # --------------------------------------------------------------------------
    # Metric 2: Latency Check (p95 latency must be <= 500ms / 0.5s)
    # --------------------------------------------------------------------------
    - name: latency-p95
      interval: 30s
      count: 3
      failureLimit: {{ .Values.argoRollouts.analysis.failureLimit | default 1 }}
      successCondition: len(result) == 0 || result[0] <= 0.5
      provider:
        prometheus:
          address: {{ .Values.argoRollouts.analysis.prometheusAddress | quote }}
          query: >-
            histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{app="shoplite"}[1m])) by (le))
{{- end }}
