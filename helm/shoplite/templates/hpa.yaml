{{- if .Values.backend.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "shoplite.fullname" . }}-backend-hpa
  labels:
    {{- include "shoplite.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: {{ if or (and .Values.argoRollouts .Values.argoRollouts.enabled) (and .Values.canary .Values.canary.enabled) }}argoproj.io/v1alpha1{{ else }}apps/v1{{ end }}
    kind: {{ if or (and .Values.argoRollouts .Values.argoRollouts.enabled) (and .Values.canary .Values.canary.enabled) }}Rollout{{ else }}Deployment{{ end }}
    name: {{ include "shoplite.fullname" . }}-backend
  minReplicas: {{ .Values.backend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.backend.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.backend.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.backend.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.backend.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.backend.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
