{{- if and .Values.backend.enabled .Values.argoRollouts .Values.argoRollouts.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shoplite.fullname" . }}-backend-canary
  labels:
    {{- include "shoplite.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
    role: canary
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "shoplite.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
{{- end }}
