# Default values for shoplite Helm chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  environment: production
  namespace: shoplite
  domain: shoplite.local

imagePullSecrets:
  - name: ecr-secret

# ------------------------------------------------------------------------------
# 1. Frontend Configuration (React / Vite)
# ------------------------------------------------------------------------------
frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: 779846822536.dkr.ecr.ap-southeast-1.amazonaws.com/shoplite/web
    tag: "v1.0.0"
    pullPolicy: IfNotPresent
  securityContext:
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    runAsNonRoot: true
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  probes:
    liveness:
      path: /
      port: 80
      initialDelaySeconds: 15
      periodSeconds: 10
    readiness:
      path: /
      port: 80
      initialDelaySeconds: 5
      periodSeconds: 5

# ------------------------------------------------------------------------------
# 2. Backend REST API Configuration (FastAPI)
# ------------------------------------------------------------------------------
backend:
  enabled: true
  replicaCount: 2
  image:
    repository: 779846822536.dkr.ecr.ap-southeast-1.amazonaws.com/shoplite/catalog-api
    tag: "v1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  env:
    PORT: "8000"
    LOG_LEVEL: "info"
    METRICS_ENABLED: "true"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  probes:
    liveness:
      path: /healthz
      port: 8000
      initialDelaySeconds: 20
      periodSeconds: 10
    readiness:
      path: /readyz
      port: 8000
      initialDelaySeconds: 10
      periodSeconds: 5

# ------------------------------------------------------------------------------
# 3. Asynchronous Worker Configuration (Redis Queue Consumer)
# ------------------------------------------------------------------------------
worker:
  enabled: true
  replicaCount: 1
  image:
    repository: 779846822536.dkr.ecr.ap-southeast-1.amazonaws.com/shoplite/order-worker
    tag: "v1.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi

# ------------------------------------------------------------------------------
# 4. PostgreSQL Database Configuration (Stateful Storage)
# ------------------------------------------------------------------------------
postgres:
  enabled: true
  replicaCount: 1
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  auth:
    database: shoplite_db
    username: shoplite_admin
    # In dry-run / default Helm deployment, generate the secret automatically
    existingSecret: ""
    secretKeys:
      adminPasswordKey: "postgres-password"
    password: "shoplite_dev_password"
  persistence:
    enabled: true
    size: 10Gi
    accessMode: ReadWriteOnce
    storageClass: "local-storage"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# ------------------------------------------------------------------------------
# 5. Redis Queue & Cache Configuration
# ------------------------------------------------------------------------------
redis:
  enabled: true
  image:
    repository: redis
    tag: "7.2-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ------------------------------------------------------------------------------
# 6. Ingress Configuration (Routing via ALB / Ingress Controller)
# ------------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: shoplite.local
      paths:
        - path: /grafana
          pathType: Prefix
          service: grafana
          port: 80
        - path: /api
          pathType: Prefix
          service: backend
          port: 8000
        - path: /
          pathType: Prefix
          service: frontend
          port: 80
    - host: ""
      paths:
        - path: /grafana
          pathType: Prefix
          service: grafana
          port: 80
        - path: /api
          pathType: Prefix
          service: backend
          port: 8000
        - path: /
          pathType: Prefix
          service: frontend
          port: 80

# ------------------------------------------------------------------------------
# 7. Security Context (Non-Root Principle of Least Privilege)
# ------------------------------------------------------------------------------
securityContext:
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  runAsNonRoot: true

# ------------------------------------------------------------------------------
# 8. Network Policy (Zero-Trust Microsegmentation)
# ------------------------------------------------------------------------------
networkPolicy:
  enabled: true

# ------------------------------------------------------------------------------
# 9. Bonus: Argo Rollouts Progressive Delivery (+5 Bonus Marks)
# Enables Canary Deployment with Automated Prometheus Metric Analysis & Rollback
# ------------------------------------------------------------------------------
argoRollouts:
  enabled: true
  analysis:
    enabled: true
    prometheusAddress: "http://shoplite-prometheus-server.observability.svc.cluster.local:80"
    failureLimit: 1



