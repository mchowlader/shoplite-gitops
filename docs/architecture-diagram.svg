<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Title & Header -->
  <text x="500" y="38" fill="#38bdf8" font-size="22" font-weight="700" text-anchor="middle">ShopLite on AWS — Microservices & Observability Architecture</text>
  <text x="500" y="60" fill="#94a3b8" font-size="13" text-anchor="middle">DEVOPS-CAP-601 &bull; 2-AZ AWS Custom VPC &bull; Kubernetes Cluster &bull; LGTM Observability Stack</text>

  <!-- AWS VPC Boundary -->
  <rect x="40" y="85" width="920" height="585" rx="14" fill="#131d33" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="85" width="220" height="26" rx="4" fill="#0284c7"/>
  <text x="150" y="103" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">AWS Custom VPC (10.0.0.0/16)</text>

  <!-- External Client Box -->
  <rect x="70" y="130" width="160" height="55" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="150" y="155" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Internet Clients</text>
  <text x="150" y="172" fill="#94a3b8" font-size="11" text-anchor="middle">Browser / API Users</text>

  <!-- AWS ALB Box -->
  <rect x="300" y="130" width="180" height="55" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="390" y="155" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">AWS ALB</text>
  <text x="390" y="172" fill="#94a3b8" font-size="11" text-anchor="middle">Public Subnets (Port 80)</text>

  <!-- Ingress Controller -->
  <rect x="550" y="130" width="180" height="55" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="640" y="155" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Ingress Controller</text>
  <text x="640" y="172" fill="#94a3b8" font-size="11" text-anchor="middle">NGINX Host Routing</text>

  <!-- Connectors Client -> ALB -> Ingress -->
  <line x1="230" y1="157" x2="295" y2="157" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="157" x2="545" y2="157" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Kubernetes Cluster Boundary -->
  <rect x="70" y="215" width="860" height="430" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <rect x="70" y="215" width="210" height="24" rx="4" fill="#475569"/>
  <text x="175" y="232" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Kubernetes Cluster (Private Subnets)</text>

  <!-- Workload: Frontend -->
  <rect x="100" y="260" width="160" height="70" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="180" y="288" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">frontend</text>
  <text x="180" y="306" fill="#94a3b8" font-size="10" text-anchor="middle">React SPA / Nginx</text>
  <text x="180" y="320" fill="#3b82f6" font-size="9" text-anchor="middle">Port 80 / Non-root 1001</text>

  <!-- Workload: Catalog API -->
  <rect x="330" y="260" width="180" height="70" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="420" y="288" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">catalog-api</text>
  <text x="420" y="306" fill="#94a3b8" font-size="10" text-anchor="middle">FastAPI (Python 3.11)</text>
  <text x="420" y="320" fill="#06b6d4" font-size="9" text-anchor="middle">Rollout Canary &bull; Exemplars</text>

  <!-- Workload: Redis -->
  <rect x="580" y="260" width="160" height="70" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="660" y="288" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">redis</text>
  <text x="660" y="306" fill="#94a3b8" font-size="10" text-anchor="middle">FIFO Message Broker</text>
  <text x="660" y="320" fill="#ef4444" font-size="9" text-anchor="middle">orders:pending Stream</text>

  <!-- Workload: Order Worker -->
  <rect x="760" y="260" width="150" height="70" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
  <text x="835" y="288" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">order-worker</text>
  <text x="835" y="306" fill="#94a3b8" font-size="10" text-anchor="middle">Async Consumer (Py 3.11)</text>
  <text x="835" y="320" fill="#eab308" font-size="9" text-anchor="middle">W3C Trace Extraction</text>

  <!-- Workload: PostgreSQL StatefulSet -->
  <rect x="580" y="370" width="160" height="65" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="660" y="395" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">shoplite-postgres</text>
  <text x="660" y="412" fill="#94a3b8" font-size="10" text-anchor="middle">kind: StatefulSet</text>
  <text x="660" y="426" fill="#10b981" font-size="9" text-anchor="middle">10Gi VolumeClaimTemplate</text>

  <!-- Ingress to Frontend and API lines -->
  <path d="M 600 185 L 600 210 L 180 210 L 180 255" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 640 185 L 640 230 L 420 230 L 420 255" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- API to Redis (LPUSH with W3C traceparent) -->
  <line x1="510" y1="295" x2="573" y2="295" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="545" y="288" fill="#fca5a5" font-size="9" text-anchor="middle">LPUSH</text>

  <!-- Redis to Worker (BRPOP) -->
  <line x1="740" y1="295" x2="753" y2="295" stroke="#eab308" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="750" y="288" fill="#fde047" font-size="9" text-anchor="middle">BRPOP</text>

  <!-- Worker to Postgres -->
  <path d="M 835 330 L 835 402 L 747 402" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="418" fill="#86efac" font-size="9" text-anchor="middle">UPDATE order</text>

  <!-- Observability Subgraph -->
  <rect x="100" y="465" width="810" height="160" rx="10" fill="#162032" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="100" y="465" width="220" height="22" rx="4" fill="#6366f1"/>
  <text x="210" y="480" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">LGTM Observability Stack</text>

  <!-- Prometheus -->
  <rect x="130" y="505" width="160" height="55" rx="6" fill="#1e293b" stroke="#f97316" stroke-width="1.2"/>
  <text x="210" y="528" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Prometheus (9090)</text>
  <text x="210" y="546" fill="#fdba74" font-size="9" text-anchor="middle">OpenMetrics + Exemplars</text>

  <!-- Tempo -->
  <rect x="330" y="505" width="160" height="55" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
  <text x="410" y="528" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Tempo (4317)</text>
  <text x="410" y="546" fill="#d8b4fe" font-size="9" text-anchor="middle">OTLP Distributed Traces</text>

  <!-- Loki -->
  <rect x="530" y="505" width="160" height="55" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="610" y="528" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Loki (3100)</text>
  <text x="610" y="546" fill="#67e8f9" font-size="9" text-anchor="middle">Promtail Log Streams</text>

  <!-- Grafana -->
  <rect x="730" y="505" width="150" height="55" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="1.2"/>
  <text x="805" y="528" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Grafana (/grafana/)</text>
  <text x="805" y="546" fill="#fde047" font-size="9" text-anchor="middle">Golden Signals Dashboard</text>

  <!-- Observability Lines -->
  <path d="M 210 505 L 210 445 L 380 445 L 380 335" fill="none" stroke="#f97316" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="290" y="440" fill="#fdba74" font-size="9" text-anchor="middle">Scrape /metrics</text>

  <path d="M 420 330 L 420 500" fill="none" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow-dash)"/>
  <path d="M 835 330 L 835 480 L 470 480 L 470 500" fill="none" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow-dash)"/>

  <!-- Grafana reads from all three -->
  <line x1="290" y1="580" x2="730" y2="580" stroke="#64748b" stroke-width="1"/>
  <line x1="210" y1="560" x2="210" y2="580" stroke="#64748b" stroke-width="1"/>
  <line x1="410" y1="560" x2="410" y2="580" stroke="#64748b" stroke-width="1"/>
  <line x1="610" y1="560" x2="610" y2="580" stroke="#64748b" stroke-width="1"/>
  <line x1="805" y1="580" x2="805" y2="565" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="500" y="600" fill="#94a3b8" font-size="10" text-anchor="middle">Unified Correlation: Metrics (Exemplar TraceID) &rarr; Tempo Traces &rarr; Loki Logs</text>
</svg>
