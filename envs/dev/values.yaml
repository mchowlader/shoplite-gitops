# ==============================================================================
# ShopLite: Development Environment Helm Overrides (Question 5 & 7)
# Auto-updated by GitHub Actions CI (gitops-bump job) on every push to main.
# ==============================================================================
global:
  environment: dev

frontend:
  replicaCount: 1
  image:
    repository: 635067603641.dkr.ecr.ap-southeast-1.amazonaws.com/shoplite/web
    tag: "sha-70b6766"
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

backend:
  replicaCount: 1
  image:
    repository: 635067603641.dkr.ecr.ap-southeast-1.amazonaws.com/shoplite/catalog-api
    tag: "sha-70b6766"
  autoscaling:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

worker:
  replicaCount: 1
  image:
    repository: 635067603641.dkr.ecr.ap-southeast-1.amazonaws.com/shoplite/order-worker
    tag: "sha-70b6766"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 150m
      memory: 128Mi

postgres:
  replicaCount: 1
  auth:
    existingSecret: "shoplite-db-secret"
  persistence:
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi

chaos:
  latencyMs: "0"
  errorRate: "0.0"
  memoryLeak: "false"
  slowDb: "false"

argoRollouts:
  enabled: false

canary:
  enabled: false

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: ""
      paths:
        - path: /healthz
          pathType: Exact
          service: backend
          port: 8000
        - path: /readyz
          pathType: Exact
          service: backend
          port: 8000
        - path: /metrics
          pathType: Exact
          service: backend
          port: 8000
        - path: /
          pathType: Prefix
          service: frontend
          port: 80
  apiPath:
    enabled: true
    host: ""
    path: /api(/|$)(.*)
    rewriteTarget: /$2
    service: backend
    port: 8000
