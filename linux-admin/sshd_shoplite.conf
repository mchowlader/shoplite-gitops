# ==============================================================================
# ShopLite: Production OpenSSH Hardening Configuration
# Drop-in location: /etc/ssh/sshd_config.d/99-shoplite.conf
# ==============================================================================

# Authentication & Keys
PubkeyAuthentication yes
PasswordAuthentication no
PermitEmptyPasswords no
AuthenticationMethods publickey

# Root & Privilege Escalation Restrictions
PermitRootLogin no

# Session limits & Timeouts
MaxAuthTries 3
ClientAliveInterval 300
ClientAliveCountMax 2

# Disable insecure protocols / forwarding
X11Forwarding no
AllowTcpForwarding yes
PermitUserEnvironment no

